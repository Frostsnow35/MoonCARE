services:
  redis:
    image: redis:7-alpine
    container_name: mooncare-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mooncare-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: mooncare-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/backend/data/mooncare.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-false}
      PORT: ${PORT:-8000}
    depends_on:
      - redis
    volumes:
      - sqlite-data:/app/backend/data
    networks:
      - mooncare-network

networks:
  mooncare-network:
    driver: bridge

volumes:
  redis-data:
  sqlite-data:
