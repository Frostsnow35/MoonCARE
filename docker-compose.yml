version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mooncare-postgres
    environment:
      POSTGRES_USER: mooncare
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: mooncare
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mooncare -d mooncare"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mooncare-net
    restart: unless-stopped

  app:
    build: .
    image: mooncare:latest
    container_name: mooncare-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://mooncare:${DB_PASSWORD:-changeme}@postgres:5432/mooncare
      - SECRET_KEY=${SECRET_KEY:-must_change_this_in_production}
      - LLM_PROVIDER=${LLM_PROVIDER:-zai}
      - ZAI_API_KEY=${ZAI_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - MEMORY_SYSTEM_ENABLED=${MEMORY_SYSTEM_ENABLED:-true}
      - DEBUG=${DEBUG:-false}
      # 可选配置
      - REDIS_URL=${REDIS_URL:-}
      - SEMANTIC_CACHE_ENABLED=${SEMANTIC_CACHE_ENABLED:-false}
      - AWARENESS_MEMORY_ENABLED=${AWARENESS_MEMORY_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mooncare-net

volumes:
  postgres_data:

networks:
  mooncare-net: